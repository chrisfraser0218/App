name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finsight_test
          POSTGRES_USER: finsight_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finsight_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn --batch-mode verify
      - name: Verify against PostgreSQL
        env:
          PG_TEST_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ephemeral
        run: >-
          mvn --batch-mode test
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/finsight_test
          -Dspring.datasource.username=finsight_test
          -Dspring.datasource.password="$PG_TEST_PASSWORD"
